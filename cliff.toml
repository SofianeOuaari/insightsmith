# git-cliff configuration. CHANGELOG.md is generated from Conventional Commits
# and must never be hand-edited — fix the commit messages instead.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is generated
by [git-cliff](https://github.com/orhun/git-cliff) from the commit history.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build and packaging" },
  { message = "^ci", group = "Continuous integration" },
  { message = "^style", group = "Styling" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Housekeeping" },
  { message = "^Merge", skip = true },
]
